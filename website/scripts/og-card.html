<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=block" rel="stylesheet">
<style>
  /* Source for app/opengraph-image.png. Regenerate with: node scripts/og-image.cjs */
  :root{--paper:oklch(98.5% 0.004 250);--ink:oklch(24% 0.020 258);--ink-2:oklch(34% 0.018 257);--muted:oklch(50% 0.015 257);--rule:oklch(90% 0.008 255);--accent:oklch(55% 0.20 256);--graphite:oklch(21% 0.016 260);--on-dark:oklch(94% 0.006 255);--accent-dark:oklch(74% 0.14 256)}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:var(--paper);font-family:"IBM Plex Sans",sans-serif;color:var(--ink-2);display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;padding:72px 72px 64px;overflow:hidden}
  .l{display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;font:700 30px/1 "Space Grotesk";color:var(--ink);letter-spacing:-0.02em}
  .beta{font:500 15px/1 "JetBrains Mono";letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:5px;padding:5px 8px}
  h1{font:600 64px/1.02 "Space Grotesk";letter-spacing:-0.035em;color:var(--ink)}
  .sub{font:500 18px/1.4 "JetBrains Mono";letter-spacing:0.04em;text-transform:uppercase;color:var(--muted)}
  .card{align-self:center;background:var(--graphite);border-radius:16px;padding:28px 30px;font:500 19px/1.7 "JetBrains Mono";color:var(--on-dark)}
  .card .c{color:oklch(74% 0.012 257)} .card .k{color:var(--accent-dark)}
</style></head>
<body>
  <div class="l">
    <div class="brand">dsa tutor <span class="beta">Beta</span></div>
    <h1>Practise DSA without being handed the answer.</h1>
    <div class="sub">A Claude skill + MCP server · 12 stages</div>
  </div>
  <div class="card"><span class="c">you</span><br>just give me the code<br><br><span class="k">tutor</span><br>No code, no solution. You’ll get there yourself. For "pwwkew", what should the output be?</div>
</body></html>
